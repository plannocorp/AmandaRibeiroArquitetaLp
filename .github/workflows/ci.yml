name: CI

# Valida cada pull request. O deploy é feito pelo Cloudflare Workers Builds:
#   push em `main` -> produção; pull request/branch -> prévia.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/check-assets.sh
